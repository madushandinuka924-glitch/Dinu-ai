<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinu AI</title>

    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK (Version 10+) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { 
        getAuth, 
        signInWithPopup, 
        GoogleAuthProvider, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged 
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { 
        getFirestore, 
        collection, 
        addDoc, 
        query, 
        orderBy, 
        onSnapshot, 
        serverTimestamp 
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD9pm5dM5cFonPd2wkGW3-Mgk2Cy26hPQc",
        authDomain: "dinu-ai-9030e.firebaseapp.com",
        projectId: "dinu-ai-9030e",
        storageBucket: "dinu-ai-9030e.firebasestorage.app",
        messagingSenderId: "954455134582",
        appId: "1:954455134582:web:4317ef0c033c78a855aa57",
        measurementId: "G-FDZ61ZQSEN"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const provider = new GoogleAuthProvider();

      window.auth = auth;
      window.db = db;
      window.provider = provider;
      window.signInWithPopup = signInWithPopup;
      window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
      window.signInWithEmailAndPassword = signInWithEmailAndPassword;
      window.signOut = signOut;
      window.collection = collection;
      window.addDoc = addDoc;
      window.query = query;
      window.orderBy = orderBy;
      window.onSnapshot = onSnapshot;
      window.serverTimestamp = serverTimestamp;

      let unsubscribe = null;

      onAuthStateChanged(auth, (user) => {
        const authModal = document.getElementById('auth-modal');
        const mainApp = document.getElementById('main-app');
        const userDisplay = document.getElementById('user-name-display');

        if (user) {
          authModal.classList.add('hidden');
          mainApp.classList.remove('hidden');
          const name = user.displayName ? user.displayName.split(' ')[0] : user.email.split('@')[0];
          userDisplay.innerText = name;
          
          loadChatHistory(user.uid);
        } else {
          authModal.classList.remove('hidden');
          mainApp.classList.add('hidden');
          if (unsubscribe) unsubscribe();
        }
      });

      function loadChatHistory(userId) {
        const chatContainer = document.getElementById('chat-history');
        const welcomeContainer = document.getElementById('welcome-container');
        
        const q = query(
          collection(db, "users", userId, "messages"),
          orderBy("createdAt", "asc")
        );

        unsubscribe = onSnapshot(q, (snapshot) => {
          if (!snapshot.empty) {
            welcomeContainer.classList.add('hidden');
            chatContainer.classList.remove('hidden');
          } else {
            welcomeContainer.classList.remove('hidden');
            chatContainer.classList.add('hidden');
          }

          chatContainer.innerHTML = '';
          snapshot.forEach((doc) => {
            const data = doc.data();
            appendMessageUI(data.text, data.sender);
          });
          
          chatContainer.scrollTop = chatContainer.scrollHeight;
        });
      }

      window.saveMessageToDB = async function(text, sender) {
        if (!auth.currentUser) return;
        try {
          await addDoc(collection(db, "users", auth.currentUser.uid, "messages"), {
            text: text,
            sender: sender,
            createdAt: serverTimestamp()
          });
        } catch (e) {
          console.error("Error saving chat: ", e);
        }
      };
    </script>

    <style>
      body { font-family: 'Inter', sans-serif; }
      .gradient-bg { background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); }
      .gradient-text {
        background: linear-gradient(135deg, #4f46e5 0%, #9333ea 50%, #e11d48 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen flex flex-col justify-between overflow-hidden transition-colors duration-200">

    <!-- LOGIN / SIGNUP MODAL -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-3xl p-8 w-full max-w-md shadow-2xl text-center relative overflow-hidden">
            <div class="mb-6 flex justify-center items-center gap-2">
                <div class="w-10 h-10 rounded-2xl gradient-bg flex items-center justify-center text-white shadow-lg shadow-purple-500/30">
                    <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-800 dark:text-white">Dinu AI</h1>
            </div>
            <p class="text-slate-500 dark:text-slate-400 text-sm mb-6 font-medium">Welcome back! Sign in to access your AI workspace.</p>

            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Email Address</label>
                    <input type="email" id="auth-email" placeholder="name@example.com" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Password</label>
                    <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 text-slate-800 dark:text-white">
                </div>

                <div id="auth-error" class="text-rose-500 text-xs font-medium text-center hidden bg-rose-50 dark:bg-rose-900/30 p-2.5 rounded-lg border border-rose-100 dark:border-rose-800"></div>

                <div class="flex gap-3 pt-2">
                    <button onclick="handleLogin()" class="flex-1 gradient-bg text-white font-semibold py-3 rounded-xl text-sm shadow-lg shadow-purple-500/25">Log In</button>
                    <button onclick="handleSignup()" class="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold py-3 rounded-xl text-sm">Sign Up</button>
                </div>

                <div class="flex items-center my-4">
                    <div class="flex-1 border-t border-slate-200 dark:border-slate-700"></div>
                    <span class="px-3 text-xs text-slate-400 font-medium">OR</span>
                    <div class="flex-1 border-t border-slate-200 dark:border-slate-700"></div>
                </div>

                <button onclick="handleGoogleLogin()" class="w-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 font-semibold py-3 rounded-xl text-sm flex items-center justify-center gap-3 shadow-sm">
                    <i class="fa-brands fa-google text-red-500 text-base"></i> Continue with Google
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="main-app" class="hidden flex h-screen w-full bg-slate-50 dark:bg-slate-900">
        <!-- Sidebar Navigation -->
        <aside class="w-16 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 flex flex-col justify-between items-center py-5 shadow-sm">
            <div class="flex flex-col items-center gap-6">
                <div class="w-10 h-10 rounded-2xl gradient-bg flex items-center justify-center text-white shadow-md shadow-purple-500/20">
                    <i class="fa-solid fa-wand-magic-sparkles text-base"></i>
                </div>
                <button onclick="startNewChat()" title="New Chat" class="w-10 h-10 rounded-xl bg-purple-50 dark:bg-purple-950/50 text-purple-600 dark:text-purple-400 hover:bg-purple-100 dark:hover:bg-purple-900 flex items-center justify-center transition">
                    <i class="fa-solid fa-plus text-base"></i>
                </button>
            </div>
            <div class="flex flex-col gap-4">
                <button onclick="toggleDarkMode()" id="theme-toggle-btn" title="Toggle Theme" class="w-10 h-10 rounded-xl text-slate-400 hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-slate-800 flex items-center justify-center transition">
                    <i class="fa-solid fa-moon text-base"></i>
                </button>
                <button onclick="downloadChatHistory()" title="Download Chat" class="w-10 h-10 rounded-xl text-slate-400 hover:text-purple-600 hover:bg-purple-50 dark:hover:bg-slate-800 flex items-center justify-center transition">
                    <i class="fa-solid fa-download text-base"></i>
                </button>
                <button onclick="handleLogout()" title="Sign Out" class="w-10 h-10 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-slate-800 flex items-center justify-center transition">
                    <i class="fa-solid fa-arrow-right-from-bracket text-base"></i>
                </button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <div class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-900 relative">
            <header class="h-16 px-6 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 flex justify-between items-center sticky top-0 z-10">
                <div class="flex items-center gap-2.5">
                    <span class="font-bold text-slate-800 dark:text-white text-base">Dinu AI</span>
                    <span class="bg-purple-100 dark:bg-purple-900/50 text-purple-700 dark:text-purple-300 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Pro</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="startNewChat()" class="text-xs font-semibold bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-xl transition flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-plus"></i> New Chat
                    </button>
                    <button onclick="downloadChatHistory()" class="text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 px-3 py-2 rounded-xl transition flex items-center gap-1.5">
                        <i class="fa-solid fa-file-arrow-down"></i> Export
                    </button>
                    <button onclick="handleLogout()" class="text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-rose-50 dark:hover:bg-rose-950/50 hover:text-rose-600 dark:hover:text-rose-400 text-slate-600 dark:text-slate-300 px-3 py-2 rounded-xl transition">Sign Out</button>
                </div>
            </header>

            <!-- Chat Container -->
            <main class="flex-1 overflow-y-auto px-4 py-6 max-w-3xl mx-auto w-full flex flex-col">
                <div id="welcome-container" class="my-auto space-y-6 text-center py-10">
                    <div class="inline-flex p-4 rounded-3xl gradient-bg text-white shadow-xl shadow-purple-500/30 mb-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-3xl"></i>
                    </div>
                    <div class="space-y-2">
                        <h1 class="text-4xl font-extrabold text-slate-800 dark:text-white">Hello, <span id="user-name-display" class="gradient-text">User</span></h1>
                        <p class="text-slate-500 dark:text-slate-400 text-base font-medium max-w-md mx-auto">Ask me anything, translate languages, write code, or generate ideas!</p>
                    </div>
                </div>

                <div id="chat-history" class="space-y-6 w-full hidden pb-6"></div>
            </main>

            <!-- Input Bar & Controls -->
            <footer class="p-4 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 max-w-3xl mx-auto w-full rounded-t-3xl shadow-lg">
                <div class="relative flex items-end bg-slate-100 dark:bg-slate-800/80 rounded-2xl p-2 border border-slate-200 dark:border-slate-700 focus-within:border-purple-500 focus-within:ring-2 focus-within:ring-purple-200 dark:focus-within:ring-purple-900 transition">
                    <textarea id="user-input" rows="1" placeholder="Type a message..." class="w-full bg-transparent text-slate-800 dark:text-white focus:outline-none text-sm resize-none px-3 py-2 max-h-32 min-h-[40px]" onkeydown="handleKeyPress(event)"></textarea>
                    
                    <button onclick="sendMessage()" class="gradient-bg text-white w-9 h-9 rounded-xl flex items-center justify-center shadow-md shadow-purple-500/20 hover:opacity-95 transition flex-shrink-0 mb-0.5">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </div>
                <p class="text-[11px] text-slate-400 dark:text-slate-500 text-center mt-2 font-medium">
                    Dinu-AI saves your conversations across all devices automatically.
                </p>
            </footer>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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"; // ඔයාගේ Groq Key එක මෙතනට දාන්න

        // Dark Mode Logic
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            updateThemeIcon(true);
        } else {
            document.documentElement.classList.remove('dark');
            updateThemeIcon(false);
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            updateThemeIcon(isDark);
        }

        function updateThemeIcon(isDark) {
            const btn = document.getElementById('theme-toggle-btn');
            if (btn) {
                btn.innerHTML = isDark ? `<i class="fa-solid fa-sun text-amber-400 text-base"></i>` : `<i class="fa-solid fa-moon text-base"></i>`;
            }
        }

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try {
                await window.signInWithEmailAndPassword(window.auth, email, password);
            } catch (err) { showError(err.message); }
        }

        async function handleSignup() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try {
                await window.createUserWithEmailAndPassword(window.auth, email, password);
            } catch (err) { showError(err.message); }
        }

        async function handleGoogleLogin() {
            try { await window.signInWithPopup(window.auth, window.provider); } 
            catch (err) { showError(err.message); }
        }

        function handleLogout() { window.signOut(window.auth); }

        function showError(msg) {
            const errEl = document.getElementById('auth-error');
            errEl.innerText = msg;
            errEl.classList.remove('hidden');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function startNewChat() {
            const chatHistory = document.getElementById('chat-history');
            const welcomeContainer = document.getElementById('welcome-container');
            chatHistory.innerHTML = '';
            chatHistory.classList.add('hidden');
            welcomeContainer.classList.remove('hidden');
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text);
            btn.innerHTML = `<i class="fa-solid fa-check text-green-500"></i>`;
            setTimeout(() => {
                btn.innerHTML = `<i class="fa-regular fa-copy"></i>`;
            }, 2000);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            }
        }

        function downloadChatHistory() {
            const chatBox = document.getElementById('chat-history');
            if (!chatBox || chatBox.innerText.trim() === "") return alert("No chat history to export!");

            const blob = new Blob([chatBox.innerText], { type: 'text/plain' });
            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(blob);
            anchor.download = `Dinu-AI-Chat-${new Date().toISOString().slice(0,10)}.txt`;
            anchor.click();
        }

        function appendMessageUI(text, sender) {
            const chatHistory = document.getElementById('chat-history');

            if (sender === 'user') {
                chatHistory.innerHTML += `
                    <div class="flex justify-end items-end gap-2">
                        <div class="gradient-bg text-white px-5 py-3 rounded-3xl rounded-br-md max-w-[80%] text-sm shadow-md shadow-purple-500/10 leading-relaxed font-medium whitespace-pre-wrap">
                            ${text}
                        </div>
                    </div>
                `;
            } else {
                chatHistory.innerHTML += `
                    <div class="flex items-start gap-3 group">
                        <div class="w-8 h-8 rounded-xl gradient-bg text-white flex items-center justify-center flex-shrink-0 shadow-md shadow-purple-500/20 mt-1">
                            <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                        </div>
                        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 px-5 py-3.5 rounded-3xl rounded-tl-md max-w-[85%] text-sm leading-relaxed shadow-sm relative whitespace-pre-wrap">
                            ${text}
                            <div class="flex items-center gap-3 mt-3 pt-2 border-t border-slate-100 dark:border-slate-700 text-slate-400 text-xs">
                                <button onclick="copyText(\`${text.replace(/`/g, '\\`')}\`, this)" title="Copy text" class="hover:text-purple-600 dark:hover:text-purple-400 transition">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                                <button onclick="speakText(\`${text.replace(/`/g, '\\`')}\`)" title="Read aloud" class="hover:text-purple-600 dark:hover:text-purple-400 transition">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatHistory = document.getElementById('chat-history');
            const welcomeContainer = document.getElementById('welcome-container');
            const text = input.value.trim();
            if (!text) return;

            welcomeContainer.classList.add('hidden');
            chatHistory.classList.remove('hidden');

            input.value = '';

            // 1. Save User Message
            await window.saveMessageToDB(text, 'user');

            // 2. Add Animated Loading Indicator
            const loadingId = 'loading-' + Date.now();
            chatHistory.innerHTML += `
                <div id="${loadingId}" class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-xl gradient-bg text-white flex items-center justify-center flex-shrink-0 shadow-md shadow-purple-500/20 mt-1">
                        <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                    </div>
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-400 px-5 py-3.5 rounded-3xl rounded-tl-md text-sm font-medium shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-circle-notch animate-spin text-purple-500"></i> Dinu-AI is thinking...
                    </div>
                </div>
            `;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: text }]
                    })
                });
                const data = await res.json();
                const reply = data.choices[0]?.message?.content || "No response received.";
                
                // Remove Loading
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();

                // 3. Save AI Reply
                await window.saveMessageToDB(reply, 'ai');

            } catch (e) {
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) {
                    loadingElem.outerHTML = `
                        <div class="text-rose-500 text-xs bg-rose-50 dark:bg-rose-900/30 p-3 rounded-xl border border-rose-100 dark:border-rose-800">Error connecting to AI service. Please check your Groq API key.</div>
                    `;
                }
            }
        }
    </script>
</body>
</html>
