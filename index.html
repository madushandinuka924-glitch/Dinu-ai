<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinu AI - Ultimate Pro</title>

    <!-- Tailwind CSS, FontAwesome & PDF.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, collection, addDoc, doc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD9pm5dM5cFonPd2wkGW3-Mgk2Cy26hPQc",
        authDomain: "dinu-ai-9030e.firebaseapp.com",
        projectId: "dinu-ai-9030e",
        storageBucket: "dinu-ai-9030e.firebasestorage.app",
        messagingSenderId: "954455134582",
        appId: "1:954455134582:web:4317ef0c033c78a855aa57",
        measurementId: "G-FDZ61ZQSEN"
      };

      const app = initializeApp(firebaseConfig);
      window.auth = getAuth(app);
      window.db = getFirestore(app);
      window.provider = new GoogleAuthProvider();
      window.signInWithPopup = signInWithPopup;
      window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
      window.signInWithEmailAndPassword = signInWithEmailAndPassword;
      window.signOut = signOut;
      window.collection = collection;
      window.addDoc = addDoc;
      window.doc = doc;
      window.deleteDoc = deleteDoc;
      window.query = query;
      window.orderBy = orderBy;
      window.onSnapshot = onSnapshot;
      window.serverTimestamp = serverTimestamp;

      onAuthStateChanged(window.auth, (user) => {
        const authModal = document.getElementById('auth-modal');
        const mainApp = document.getElementById('main-app');
        if (user) {
          authModal.classList.add('hidden');
          mainApp.classList.remove('hidden');
          document.getElementById('user-name-display').innerText = user.displayName ? user.displayName.split(' ')[0] : user.email.split('@')[0];
          loadSessions(user.uid);
        } else {
          authModal.classList.remove('hidden');
          mainApp.classList.add('hidden');
        }
      });
    </script>

    <style>
      body { font-family: 'Inter', sans-serif; }
      .gradient-bg { background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #334155; }
      .sidebar-transition { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen overflow-hidden">

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-[100]">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl text-center">
            <h1 class="text-3xl font-extrabold mb-2">Dinu AI</h1>
            <p class="text-slate-400 text-xs mb-6">Sign in to access your ultimate workspace</p>
            <div class="space-y-4">
                <input type="email" id="auth-email" placeholder="Email" class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-700 text-sm">
                <input type="password" id="auth-password" placeholder="Password" class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-700 text-sm">
                <button onclick="handleAuth(false)" class="w-full gradient-bg text-white py-3 rounded-xl font-bold text-sm shadow-md">Log In</button>
                <button onclick="handleAuth(true)" class="w-full bg-slate-100 dark:bg-slate-700 py-3 rounded-xl text-sm font-semibold">Sign Up</button>
                <button onclick="window.signInWithPopup(window.auth, window.provider)" class="w-full border border-slate-200 dark:border-slate-700 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2">
                    <i class="fa-brands fa-google text-red-500"></i> Continue with Google
                </button>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <div id="main-app" class="hidden flex h-screen w-full relative overflow-hidden">
        
        <!-- Overlay for Mobile Sidebar -->
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden"></div>

        <!-- Sidebar (Multi Chat Threads & Responsive) -->
        <aside id="sidebar" class="fixed md:relative z-50 w-64 h-full border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 flex flex-col justify-between p-4 sidebar-transition -translate-x-full md:translate-x-0">
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-xl gradient-bg flex items-center justify-center text-white"><i class="fa-solid fa-wand-magic-sparkles text-xs"></i></div>
                        <span class="font-bold text-sm">Dinu AI</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleDarkMode()" class="text-slate-400 hover:text-amber-500 p-1"><i class="fa-solid fa-moon"></i></button>
                        <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                </div>

                <button onclick="startNewSession()" class="w-full bg-purple-50 dark:bg-purple-950/50 text-purple-600 dark:text-purple-300 font-semibold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-2 border border-purple-200 dark:border-purple-800 hover:bg-purple-100 transition">
                    <i class="fa-solid fa-plus"></i> New Chat
                </button>

                <!-- Session List -->
                <div class="space-y-1">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-2">Recent Chats</p>
                    <div id="session-list" class="space-y-1 max-h-[60vh] overflow-y-auto"></div>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500">
                <span id="user-name-display" class="truncate font-medium">User</span>
                <button onclick="window.signOut(window.auth)" title="Sign Out" class="hover:text-rose-500"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-900 w-full relative">
            <header class="h-14 px-4 md:px-6 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-white/70 dark:bg-slate-950/70 backdrop-blur-md">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-slate-700"><i class="fa-solid fa-bars text-lg"></i></button>
                    <span class="text-xs font-semibold text-slate-500" id="current-chat-title">New Conversation</span>
                </div>
                <button onclick="downloadChatHistory()" class="text-xs bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-200">
                    <i class="fa-solid fa-download mr-1"></i> Export
                </button>
            </header>

            <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-6 max-w-3xl mx-auto w-full hidden"></div>

            <div id="welcome-container" class="flex-1 flex flex-col items-center justify-center text-center p-4 space-y-3">
                <div class="p-4 rounded-3xl gradient-bg text-white shadow-xl shadow-purple-500/20"><i class="fa-solid fa-wand-magic-sparkles text-3xl"></i></div>
                <h1 class="text-2xl md:text-3xl font-extrabold">How can I help you today?</h1>
                <p class="text-xs text-slate-400 max-w-sm">Ask anything, generate images, search the web, or analyze attached files!</p>
            </div>

            <!-- Input Controls -->
            <footer class="p-3 md:p-4 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 max-w-3xl mx-auto w-full rounded-t-3xl shadow-lg">
                <div id="file-preview" class="hidden text-xs bg-slate-100 dark:bg-slate-800 p-2 rounded-xl mb-2 flex justify-between items-center">
                    <span id="file-name" class="truncate font-medium text-purple-600"></span>
                    <button onclick="clearFile()" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="flex items-center gap-1.5 md:gap-2 bg-slate-100 dark:bg-slate-800/80 p-2 rounded-2xl border border-slate-200 dark:border-slate-700">
                    <input type="file" id="file-input" class="hidden" onchange="handleFile(event)">
                    <button onclick="document.getElementById('file-input').click()" class="text-slate-400 hover:text-purple-600 p-2" title="Attach File"><i class="fa-solid fa-paperclip"></i></button>
                    
                    <!-- Voice Mic Button -->
                    <button id="mic-btn" onclick="toggleVoiceInput()" class="text-slate-400 hover:text-purple-600 p-2" title="Voice Input"><i class="fa-solid fa-microphone"></i></button>

                    <textarea id="user-input" rows="1" class="w-full bg-transparent focus:outline-none p-1.5 md:p-2 text-sm resize-none" placeholder="Ask, search, or generate image..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                    
                    <button onclick="sendMessage()" class="gradient-bg text-white px-3.5 py-2 rounded-xl shadow-md"><i class="fa-solid fa-paper-plane text-xs"></i></button>
                </div>
            </footer>
        </main>
    </div>

    <script>
        const GROQ_API_KEY = "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"; // 🔑 Put your Groq Key here
        let currentSessionId = null;
        let attachedFile = null;
        let recognition = null;

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        async function handleAuth(isSignup) {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            if (isSignup) await window.createUserWithEmailAndPassword(window.auth, email, pass);
            else await window.signInWithEmailAndPassword(window.auth, email, pass);
        }

        // Voice Input (Web Speech API)
        function toggleVoiceInput() {
            const micBtn = document.getElementById('mic-btn');
            if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                return alert("Voice input is not supported in this browser.");
            }

            if (recognition) {
                recognition.stop();
                recognition = null;
                micBtn.classList.remove('text-red-500', 'animate-pulse');
                return;
            }

            const SpeechReg = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechReg();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => { micBtn.classList.add('text-red-500', 'animate-pulse'); };
            recognition.onresult = (e) => {
                document.getElementById('user-input').value += e.results[0][0].transcript;
                recognition.stop();
                micBtn.classList.remove('text-red-500', 'animate-pulse');
            };
            recognition.onerror = () => { micBtn.classList.remove('text-red-500', 'animate-pulse'); };
            recognition.start();
        }

        // Load All Chat Threads (Sidebar)
        function loadSessions(userId) {
            const list = document.getElementById('session-list');
            const q = window.query(window.collection(window.db, "users", userId, "sessions"), window.orderBy("createdAt", "desc"));
            window.onSnapshot(q, (snapshot) => {
                list.innerHTML = '';
                if (snapshot.empty) { startNewSession(); return; }
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const active = doc.id === currentSessionId ? 'bg-purple-100 dark:bg-purple-950/60 text-purple-700 dark:text-purple-300' : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400';
                    list.innerHTML += `
                        <div class="flex items-center justify-between p-2 rounded-xl text-xs font-medium cursor-pointer ${active}" onclick="switchSession('${doc.id}', '${data.title}')">
                            <span class="truncate w-36 md:w-40"><i class="fa-regular fa-message mr-1.5"></i>${data.title}</span>
                            <button onclick="deleteSession(event, '${doc.id}')" class="text-slate-400 hover:text-rose-500 p-1"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    `;
                });
                if (!currentSessionId && !snapshot.empty) switchSession(snapshot.docs[0].id, snapshot.docs[0].data().title);
            });
        }

        async function startNewSession() {
            if (!window.auth.currentUser) return;
            const res = await window.addDoc(window.collection(window.db, "users", window.auth.currentUser.uid, "sessions"), {
                title: "New Chat",
                createdAt: window.serverTimestamp()
            });
            switchSession(res.id, "New Chat");
            if (window.innerWidth < 768) toggleSidebar();
        }

        function switchSession(id, title) {
            currentSessionId = id;
            document.getElementById('current-chat-title').innerText = title;
            loadMessages(id);
            if (window.innerWidth < 768 && !document.getElementById('sidebar').classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        async function deleteSession(e, id) {
            e.stopPropagation();
            await window.deleteDoc(window.doc(window.db, "users", window.auth.currentUser.uid, "sessions", id));
            if (currentSessionId === id) startNewSession();
        }

        function loadMessages(sessionId) {
            const chatContainer = document.getElementById('chat-history');
            const welcome = document.getElementById('welcome-container');
            const q = window.query(window.collection(window.db, "users", window.auth.currentUser.uid, "sessions", sessionId, "messages"), window.orderBy("createdAt", "asc"));
            
            window.onSnapshot(q, (snapshot) => {
                if (!snapshot.empty) { welcome.classList.add('hidden'); chatContainer.classList.remove('hidden'); }
                else { welcome.classList.remove('hidden'); chatContainer.classList.add('hidden'); }
                chatContainer.innerHTML = '';
                snapshot.forEach(doc => appendMessageUI(doc.data().text, doc.data().sender));
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        // Web Search Integration (DuckDuckGo API)
        async function fetchWebSearch(query) {
            try {
                const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`);
                const data = await res.json();
                return data.AbstractText || data.RelatedTopics[0]?.Text || "No search results found.";
            } catch { return "Search failed."; }
        }

        async function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('file-preview').classList.remove('hidden');
            document.getElementById('file-name').innerText = file.name;
            if (file.type === 'application/pdf') {
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(evt.target.result)).promise;
                    let text = '';
                    for (let i = 1; i <= pdf.numPages; i++) text += (await (await pdf.getPage(i)).getTextContent()).items.map(item => item.str).join(' ') + '\n';
                    attachedFile = { name: file.name, content: text };
                };
                reader.readAsArrayBuffer(file);
            } else {
                const reader = new FileReader();
                reader.onload = (evt) => { attachedFile = { name: file.name, content: evt.target.result }; };
                reader.readAsText(file);
            }
        }

        function clearFile() { attachedFile = null; document.getElementById('file-preview').classList.add('hidden'); }

        function appendMessageUI(text, sender) {
            const chatHistory = document.getElementById('chat-history');
            const isImage = text.startsWith('[IMAGE_GEN]:');
            const content = isImage ? `<img src="${text.split(':')[1]}" class="rounded-xl w-full shadow-md">` : text;

            chatHistory.innerHTML += `
                <div class="flex ${sender === 'user' ? 'justify-end' : 'justify-start'}">
                    <div class="${sender === 'user' ? 'gradient-bg text-white' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700'} px-5 py-3 rounded-2xl max-w-[85%] text-sm shadow-sm relative group">
                        ${content}
                        ${sender === 'ai' && !isImage ? `
                            <div class="flex gap-2 mt-2 pt-2 border-t border-slate-100 dark:border-slate-700 text-slate-400 text-xs">
                                <button onclick="navigator.clipboard.writeText(\`${text.replace(/`/g, '\\`')}\`)" title="Copy"><i class="fa-regular fa-copy"></i></button>
                                <button onclick="window.speechSynthesis.speak(new SpeechSynthesisUtterance(\`${text.replace(/`/g, '\\`')}\`))" title="Read Aloud"><i class="fa-solid fa-volume-high"></i></button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            let text = input.value.trim();
            if (!text && !attachedFile) return;

            if (!currentSessionId) await startNewSession();

            // Auto title update for new session
            const chatTitle = document.getElementById('current-chat-title').innerText;
            if (chatTitle === "New Chat" || chatTitle === "New Conversation") {
                const newTitle = text.slice(0, 20) + "...";
                await window.addDoc(window.collection(window.db, "users", window.auth.currentUser.uid, "sessions", currentSessionId), { title: newTitle }, { merge: true });
            }

            // 1. Image Generation Check
            if (text.toLowerCase().includes('generate') || text.toLowerCase().includes('create an image') || text.toLowerCase().includes('draw')) {
                const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?nologo=true`;
                await window.addDoc(window.collection(window.db, "users", window.auth.currentUser.uid, "sessions", currentSessionId, "messages"), { text: text, sender: 'user', createdAt: window.serverTimestamp() });
                await window.addDoc(window.collection(window.db, "users", window.auth.currentUser.uid, "sessions", currentSessionId, "messages"), { text: '[IMAGE_GEN]:' + url, sender: 'ai', createdAt: window.serverTimestamp() });
                input.value = ''; return;
            }

            // 2. Real-time Search Check
            let searchContext = "";
            if (text.toLowerCase().startsWith('search') || text.toLowerCase().includes('latest news') || text.toLowerCase().includes('weather')) {
                const searchRes = await fetchWebSearch(text);
                searchContext = `\n[Web Search Result]: ${searchRes}`;
            }

            // 3. User Message Prep
            let fullPrompt = text;
            if (attachedFile) fullPrompt += `\n[File Attached: ${attachedFile.name}]\nContent: ${attachedFile.content}`;
            if (searchContext) fullPrompt += searchContext;

            await window.addDoc(window.collection(window.db, "users", window.auth.currentUser.uid, "sessions", currentSessionId, "messages"), { text: text, sender: 'user', createdAt: window.serverTimestamp() });
            input.value = '';
            clearFile();

            // 4. Call Groq API
            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${GROQ_API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: fullPrompt }]
                    })
                });
                const data = await res.json();
                const reply = data.choices[0]?.message?.content || "No answer received.";
                await window.addDoc(window.collection(window.db, "users", window.auth.currentUser.uid, "sessions", currentSessionId, "messages"), { text: reply, sender: 'ai', createdAt: window.serverTimestamp() });
            } catch {
                alert("Error connecting to AI service. Please check API key.");
            }
        }

        function downloadChatHistory() {
            const chatBox = document.getElementById('chat-history');
            if (!chatBox) return;
            const blob = new Blob([chatBox.innerText], { type: 'text/plain' });
            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(blob);
            anchor.download = `Dinu-AI-Chat.txt`;
            anchor.click();
        }
    </script>
</body>
</html>
