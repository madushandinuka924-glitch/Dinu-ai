<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinu-AI</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Version 10+) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { 
        getAuth, 
        signInWithPopup, 
        GoogleAuthProvider, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged 
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      // Updated Firebase Config
      const firebaseConfig = {
        apiKey: "AIzaSyD9pm5dM5cFonPd2wkGW3-Mgk2Cy26hPQc",
        authDomain: "dinu-ai-9030e.firebaseapp.com",
        projectId: "dinu-ai-9030e",
        storageBucket: "dinu-ai-9030e.firebasestorage.app",
        messagingSenderId: "954455134582",
        appId: "1:954455134582:web:4317ef0c033c78a855aa57",
        measurementId: "G-FDZ61ZQSEN"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      // Make functions globally available
      window.auth = auth;
      window.provider = provider;
      window.signInWithPopup = signInWithPopup;
      window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
      window.signInWithEmailAndPassword = signInWithEmailAndPassword;
      window.signOut = signOut;

      // Monitor Auth State
      onAuthStateChanged(auth, (user) => {
        const authModal = document.getElementById('auth-modal');
        const mainApp = document.getElementById('main-app');
        const userDisplay = document.getElementById('user-name-display');

        if (user) {
          authModal.classList.add('hidden');
          mainApp.classList.remove('hidden');
          const name = user.displayName ? user.displayName.split(' ')[0] : user.email.split('@')[0];
          userDisplay.innerText = name;
        } else {
          authModal.classList.remove('hidden');
          mainApp.classList.add('hidden');
        }
      });
    </script>

    <style>
      .gradient-text {
        background: linear-gradient(135deg, #4285F4 0%, #9B51E0 50%, #EA4335 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .sparkle-icon {
        background: linear-gradient(135deg, #4285F4, #9B51E0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
</head>
<body class="bg-white text-gray-800 font-sans h-screen flex flex-col justify-between overflow-hidden">

    <!-- LOGIN / SIGNUP MODAL -->
    <div id="auth-modal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white border border-gray-200 rounded-3xl p-8 w-full max-w-md shadow-2xl text-center">
            <div class="mb-6 flex justify-center items-center gap-2">
                <i class="fa-solid fa-sparkles text-2xl sparkle-icon"></i>
                <h1 class="text-3xl font-bold tracking-tight">Dinu AI</h1>
            </div>
            <p class="text-gray-500 text-sm mb-6">Welcome! Log in to access your personal AI assistant.</p>

            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Email Address</label>
                    <input type="email" id="auth-email" placeholder="name@example.com" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                    <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800">
                </div>

                <div id="auth-error" class="text-red-500 text-xs text-center hidden"></div>

                <div class="flex gap-3 pt-2">
                    <button onclick="handleLogin()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-sm transition shadow-sm">Log In</button>
                    <button onclick="handleSignup()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl text-sm transition">Sign Up</button>
                </div>

                <div class="flex items-center my-4">
                    <div class="flex-1 border-t border-gray-200"></div>
                    <span class="px-3 text-xs text-gray-400">OR</span>
                    <div class="flex-1 border-t border-gray-200"></div>
                </div>

                <button onclick="handleGoogleLogin()" class="w-full bg-white border border-gray-300 text-gray-700 font-semibold py-3 rounded-xl text-sm flex items-center justify-center gap-2 hover:bg-gray-50 transition shadow-sm">
                    <i class="fa-brands fa-google text-red-500"></i> Continue with Google
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="main-app" class="hidden flex h-screen w-full">
        <!-- Sidebar -->
        <aside class="w-16 flex flex-col justify-between items-center py-4 border-r border-gray-100 bg-white">
            <div class="flex flex-col items-center gap-6">
                <button class="text-gray-500 hover:text-gray-800 p-2 rounded-lg"><i class="fa-solid fa-bars text-lg"></i></button>
                <button class="text-gray-500 hover:text-gray-800 p-2 rounded-lg"><i class="fa-regular fa-bell text-lg"></i></button>
                <button class="p-2 rounded-full bg-blue-50 text-blue-600"><i class="fa-solid fa-sparkles text-lg"></i></button>
            </div>
            <div>
                <button onclick="handleLogout()" title="Sign Out" class="text-gray-400 hover:text-red-500 p-2 rounded-lg">
                    <i class="fa-solid fa-right-from-bracket text-lg"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col justify-between h-full bg-white relative">
            <header class="p-4 flex justify-between items-center text-xs text-gray-500">
                <div class="flex items-center gap-1 font-medium">
                    <span>Dinu-AI</span>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="handleLogout()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-full transition">Sign Out</button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto px-6 max-w-2xl mx-auto w-full flex flex-col justify-center">
                <div id="welcome-container" class="space-y-6">
                    <div class="flex items-center gap-2 text-sm font-medium text-gray-800">
                        <i class="fa-solid fa-sparkles sparkle-icon"></i>
                        <span>Welcome to your AI assistant</span>
                    </div>

                    <div class="space-y-1">
                        <h1 class="text-4xl font-semibold text-gray-800">Hello, <span id="user-name-display" class="gradient-text font-bold">User</span></h1>
                        <h2 class="text-4xl font-semibold text-gray-400">How can I help you today?</h2>
                    </div>

                    <div class="bg-gray-50 border border-gray-100 p-4 rounded-2xl flex items-start gap-3">
                        <i class="fa-solid fa-sparkles sparkle-icon mt-1"></i>
                        <p class="text-gray-700 text-sm font-medium leading-relaxed">
                            Hey there! What are you building today? How can I help?
                        </p>
                    </div>
                </div>

                <div id="chat-history" class="space-y-4 py-4 hidden"></div>
            </main>

            <footer class="p-4 max-w-2xl mx-auto w-full">
                <div class="relative flex items-center bg-gray-100 rounded-full px-5 py-3 shadow-sm border border-transparent focus-within:border-gray-300">
                    <input type="text" id="user-input" placeholder="Ask Dinu-AI..." class="w-full bg-transparent text-gray-800 focus:outline-none text-sm pr-10" onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()" class="absolute right-4 text-gray-400 hover:text-blue-600 transition">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <p class="text-[11px] text-gray-400 text-center mt-3">
                    Dinu-AI can make mistakes, so double-check important info.
                </p>
            </footer>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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"; // console.groq.com එකෙන් ගත් Key එක මෙතනට Paste කරන්න

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try {
                await window.signInWithEmailAndPassword(window.auth, email, password);
            } catch (err) {
                showError(err.message);
            }
        }

        async function handleSignup() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try {
                await window.createUserWithEmailAndPassword(window.auth, email, password);
            } catch (err) {
                showError(err.message);
            }
        }

        async function handleGoogleLogin() {
            try {
                await window.signInWithPopup(window.auth, window.provider);
            } catch (err) {
                showError(err.message);
            }
        }

        function handleLogout() {
            window.signOut(window.auth);
        }

        function showError(msg) {
            const errEl = document.getElementById('auth-error');
            errEl.innerText = msg;
            errEl.classList.remove('hidden');
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const welcomeContainer = document.getElementById('welcome-container');
            const chatHistory = document.getElementById('chat-history');
            const text = input.value.trim();
            if (!text) return;

            welcomeContainer.classList.add('hidden');
            chatHistory.classList.remove('hidden');

            chatHistory.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-gray-100 text-gray-800 px-4 py-2.5 rounded-2xl max-w-[80%] text-sm">
                        ${text}
                    </div>
                </div>
            `;
            input.value = '';

            const loadingId = 'loading-' + Date.now();
            chatHistory.innerHTML += `
                <div id="${loadingId}" class="flex items-start gap-3">
                    <i class="fa-solid fa-sparkles sparkle-icon mt-1"></i>
                    <div class="text-gray-500 text-sm animate-pulse">Thinking...</div>
                </div>
            `;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: text }]
                    })
                });
                const data = await res.json();
                const reply = data.choices[0]?.message?.content || "No response received.";
                
                document.getElementById(loadingId).outerHTML = `
                    <div class="flex items-start gap-3">
                        <i class="fa-solid fa-sparkles sparkle-icon mt-1"></i>
                        <div class="text-gray-800 text-sm leading-relaxed max-w-[85%] whitespace-pre-wrap">
                            ${reply}
                        </div>
                    </div>
                `;
            } catch (e) {
                document.getElementById(loadingId).outerHTML = `
                    <div class="text-red-500 text-xs">Error connecting to API. Please check your key.</div>
                `;
            }
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>
</html>
