  .msg-row.bot .msg-bubble { background: var(--bot-msg-bg); border: 1px solid var(--border-color); color: var(--text-primary); border-bottom-left-radius: 4px; }

  .input-container { padding: 12px 16px 20px; display: flex; justify-content: center; width: 100%; background: linear-gradient(to top, var(--bg-main) 70%, transparent); }
  .input-box-wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 8px; }
  
  .attachment-preview { display: none; align-items: center; gap: 8px; background: var(--card-bg); padding: 6px 12px; border-radius: 8px; width: fit-content; font-size: 12px; border: 1px solid var(--border-color); }

  .input-box {

    .close-sidebar-btn, .mobile-menu-btn { display: block; }

<script>
// API Configuration
const API_KEY = "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";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

let currentChatId = null;
let chats = {};
let attachedFileText = "";
let currentUser = null;

marked.setOptions({
  highlight: function(code, lang) {
    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
    return hljs.highlight(code, { language }).value;
  }
});

window.onload = () => {
  checkSession();
};

function checkSession() {
  const session = localStorage.getItem("dinu_ai_session");
  if (session) {
    currentUser = JSON.parse(session);
    document.getElementById("authOverlay").style.display = "none";
    document.getElementById("appLayout").style.display = "flex";
    document.getElementById("displayUsername").innerText = currentUser.username;
    
    loadChatsFromStorage();
    if (Object.keys(chats).length === 0) {
      createNewChat();
    } else {
      currentChatId = Object.keys(chats)[0];
      renderMessages();
      renderHistoryUI();
    }
  } else {
    document.getElementById("authOverlay").style.display = "flex";
    document.getElementById("appLayout").style.display = "none";
  }
}

function toggleAuthMode(isSignUp) {
  document.getElementById("loginForm").style.display = isSignUp ? "none" : "block";
  document.getElementById("signupForm").style.display = isSignUp ? "block" : "none";
}

function handleSignup() {
  const user = document.getElementById("signupUsername").value.trim();
  const pass = document.getElementById("signupPassword").value.trim();

  if (!user || !pass) {
    alert("Please fill in all fields");
    return;
  }

  let users = JSON.parse(localStorage.getItem("dinu_ai_users") || "{}");
  if (users[user]) {
    alert("Username already exists!");
    return;
  }

  users[user] = { password: pass };
  localStorage.setItem("dinu_ai_users", JSON.stringify(users));
  localStorage.setItem("dinu_ai_session", JSON.stringify({ username: user }));
  checkSession();
}

function handleLogin() {
  const user = document.getElementById("loginUsername").value.trim();
  const pass = document.getElementById("loginPassword").value.trim();

  let users = JSON.parse(localStorage.getItem("dinu_ai_users") || "{}");
  
  if (users[user] && users[user].password === pass) {
    localStorage.setItem("dinu_ai_session", JSON.stringify({ username: user }));
    checkSession();
  } else {
    alert("Invalid Username or Password!");
  }
}

function handleLogout() {
  localStorage.removeItem("dinu_ai_session");
  location.reload();
}

function loadChatsFromStorage() {
  if (!currentUser) return;
  const saved = localStorage.getItem(`dinu_ai_chats_${currentUser.username}`);
  if (saved) chats = JSON.parse(saved);
  else chats = {};
}

function saveChatsToStorage() {
  if (!currentUser) return;
  localStorage.setItem(`dinu_ai_chats_${currentUser.username}`, JSON.stringify(chats));
}

function createNewChat() {
  currentChatId = "chat_" + Date.now();
  chats[currentChatId] = {
    title: "New Chat",
    messages: [
      { role: "system", content: "Your name is Dinu AI. You are a helpful, smart assistant. Respond naturally in Sinhala, Singlish, or English." }
    ]
  };
  saveChatsToStorage();
  renderMessages();
  renderHistoryUI();
}

function selectChat(id) {
  currentChatId = id;
  renderMessages();
  renderHistoryUI();
  if (window.innerWidth <= 768) toggleSidebar();
}

function deleteChat(id, e) {
  e.stopPropagation();
  delete chats[id];
  saveChatsToStorage();
  if (currentChatId === id) {
    const keys = Object.keys(chats);
    if (keys.length > 0) currentChatId = keys[0];
    else createNewChat();
  }
  renderMessages();
  renderHistoryUI();
}

function renderHistoryUI() {
  const container = document.getElementById("historyItems");
  container.innerHTML = "";
  Object.keys(chats).reverse().forEach(id => {
    const item = document.createElement("div");
    item.className = `history-item ${id === currentChatId ? 'active' : ''}`;
    item.onclick = () => selectChat(id);
    item.innerHTML = `
      <i class="fa-regular fa-message"></i>
      <span class="history-text">${escapeHtml(chats[id].title)}</span>
      <button class="delete-chat-btn" aria-label="Delete Chat" onclick="deleteChat('${id}', event)"><i class="fa-solid fa-trash"></i></button>
    `;
    container.appendChild(item);
  });
}

function renderMessages() {
  const wrapper = document.getElementById("messagesWrapper");
  wrapper.innerHTML = "";
  const messages = chats[currentChatId].messages.filter(m => m.role !== "system");

  if (messages.length === 0) {
    wrapper.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon"><i class="fa-solid fa-brain"></i></div>
        <h2 class="empty-title">How can Dinu AI help you today?</h2>
        <p class="empty-subtitle">Ask anything in English, Sinhala, or Singlish.</p>
        <div class="prompt-suggestions">
          <div class="suggestion-card" onclick="usePrompt('Sinhala walin mata podi intro ekak denna')">
            <h4>💬 Introduction</h4><p>Sinhala walin mata podi intro ekak dennna.</p>
          </div>
          <div class="suggestion-card" onclick="usePrompt('Write a professional email asking for leave')">
            <h4>✉️ Email Drafting</h4><p>Write a professional email asking for leave.</p>
          </div>
          <div class="suggestion-card" onclick="usePrompt('Explain Python functions in simple terms')">
            <h4>💻 Coding Assistance</h4><p>Explain Python functions in simple terms.</p>
          </div>
          <div class="suggestion-card" onclick="usePrompt('Sri Lankawe prasidda sthana 5k kiyanna')">
            <h4>🌍 General Knowledge</h4><p>Sri Lankawe prasidda sthana 5k kiyanna.</p>
          </div>
        </div>
      </div>
    `;
    return;
  }

  messages.forEach((msg, idx) => {
    addMessageToUI(msg.content, msg.role, idx);
  });
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  let message = input.value.trim();
  if (!message && !attachedFileText) return;

  if (attachedFileText) {
    message = `[Attached File Content]:\n${attachedFileText}\n\n[User Message]: ${message}`;
    removeAttachment();
  }

  const chat = chats[currentChatId];
  if (chat.messages.filter(m => m.role !== 'system').length === 0) {
    chat.title = message.substring(0, 25) + "...";
  }

  chat.messages.push({ role: "user", content: message });
  saveChatsToStorage();
  input.value = "";
  renderMessages();
  renderHistoryUI();

  await fetchBotResponse();
}

async function fetchBotResponse() {
  const chat = chats[currentChatId];
  const loadingId = addLoadingUI();

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        messages: chat.messages,
        temperature: 0.7
      })
    });

    const data = await response.json();
    document.getElementById(loadingId)?.remove();

    if (data.error) {
      alert("API Error: " + data.error.message);
      return;
    }

    const reply = data.choices[0].message.content;
    chat.messages.push({ role: "assistant", content: reply });
    saveChatsToStorage();
    renderMessages();

  } catch (error) {
    document.getElementById(loadingId)?.remove();
    alert("Network Error: " + error.message);
  }
}

function regenerateResponse() {
  const chat = chats[currentChatId];
  if (chat.messages.length > 0 && chat.messages[chat.messages.length - 1].role === "assistant") {
    chat.messages.pop();
    saveChatsToStorage();
    renderMessages();
    fetchBotResponse();
  }
}

function addMessageToUI(text, role, index) {
  const wrapper = document.getElementById("messagesWrapper");
  const row = document.createElement("div");
  row.className = "msg-row " + (role === "user" ? "user" : "bot");

  if (role === "user") {
    row.innerHTML = `
      <div class="msg-content-box">
        <div class="msg-bubble">${escapeHtml(text)}</div>
      </div>
    `;
  } else {
    let parsedContent = marked.parse(text);
    parsedContent = parsedContent.replace(/<pre><code class="([^"]*)">([\s\S]*?)<\/code><\/pre>/g, (match, lang, code) => {
      return `
        <div class="code-container">
          <div class="code-header">
            <span>${lang || 'code'}</span>
            <button onclick="copyCode(this)"><i class="fa-regular fa-copy"></i> Copy Code</button>
          </div>
          <pre><code>${code}</code></pre>
        </div>
      `;
    });

    row.innerHTML = `
      <div class="msg-avatar bot-avatar"><i class="fa-solid fa-brain"></i></div>
      <div class="msg-content-box">
        <div class="msg-bubble">${parsedContent}</div>
        <div class="msg-actions">
          <button class="action-btn" onclick="copyText(\`${escapeJs(text)}\`)"><i class="fa-regular fa-copy"></i> Copy</button>
          <button class="action-btn" onclick="speakText(\`${escapeJs(text)}\`)"><i class="fa-solid fa-volume-high"></i> Listen</button>
          ${index === chats[currentChatId].messages.length - 1 ? `<button class="action-btn" onclick="regenerateResponse()"><i class="fa-solid fa-rotate"></i> Regenerate</button>` : ''}
        </div>
      </div>
    `;
  }

  wrapper.appendChild(row);
  const chatBody = document.getElementById("chatBody");
  chatBody.scrollTop = chatBody.scrollHeight;
}

function addLoadingUI() {
  const wrapper = document.getElementById("messagesWrapper");
  const row = document.createElement("div");
  const id = "loading-" + Date.now();
  row.id = id;
  row.className = "msg-row bot";
  row.innerHTML = `
    <div class="msg-avatar bot-avatar"><i class="fa-solid fa-brain"></i></div>
    <div class="msg-content-box">
      <div class="msg-bubble"><i class="fa-solid fa-circle-notch fa-spin"></i> Dinu AI is thinking...</div>
    </div>
  `;
  wrapper.appendChild(row);
  return id;
}

let recognition = null;
function toggleVoiceInput() {
  const voiceBtn = document.getElementById("voiceBtn");
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert("Speech Recognition is not supported in your browser.");
    return;
  }

  if (recognition) {
    recognition.stop();
    recognition = null;
    voiceBtn.classList.remove("listening");
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => voiceBtn.classList.add("listening");
  recognition.onresult = (e) => {
    document.getElementById("userInput").value = e.results[0][0].transcript;
    voiceBtn.classList.remove("listening");
    recognition = null;
  };
  recognition.onerror = () => {
    voiceBtn.classList.remove("listening");
    recognition = null;
  };
  recognition.start();
}

function speakText(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/[#*`_]/g, '');
    const utterance = new SpeechSynthesisUtterance(cleanText);
    window.speechSynthesis.speak(utterance);
  }
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    attachedFileText = evt.target.result;
    document.getElementById("fileName").innerText = file.name;
    document.getElementById("attachmentPreview").style.display = "flex";
  };
  reader.readAsText(file);
}

function removeAttachment() {
  attachedFileText = "";
  document.getElementById("fileInput").value = "";
  document.getElementById("attachmentPreview").style.display = "none";
}

function toggleTheme() {
  const body = document.body;
  const icon = document.getElementById("themeIcon");
  if (body.getAttribute("data-theme") === "light") {
    body.removeAttribute("data-theme");
    icon.className = "fa-solid fa-moon";
  } else {
    body.setAttribute("data-theme", "light");
    icon.className = "fa-solid fa-sun";
  }
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

function usePrompt(text) {
  document.getElementById("userInput").value = text;
  sendMessage();
}

function copyText(text) {
  navigator.clipboard.writeText(text);
  alert("Text copied to clipboard!");
}

function copyCode(btn) {
  const code = btn.closest('.code-container').querySelector('code').innerText;
  navigator.clipboard.writeText(code);
  btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
  setTimeout(() => btn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy Code`, 2000);
}

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function escapeJs(text) {
  return text.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
}
</script>
